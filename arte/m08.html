<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Rifa — 8 Solidária</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&display=block" rel="stylesheet">
<style>
  :root{ --fundo:#fff6ee; --coral:#e9524a; --tinta:#2a2026; --cinza:#8b7d80;
         --foto:330px; --fonte:21px; --blocos:3; --gap:10px; --causa:70px }
  [data-qtd="400"]{ --foto:268px; --fonte:21px; --blocos:4; --gap:8px; --causa:64px }
  [data-qtd="500"]{ --foto:218px; --fonte:18.5px; --blocos:5; --gap:6px; --causa:58px }
  *{ box-sizing:border-box; margin:0; padding:0 }
  html,body{ width:1080px; height:1920px; overflow:hidden; background:var(--fundo) }
  body{ font-family:"Bricolage Grotesque",sans-serif; color:var(--tinta); padding:60px; display:flex; flex-direction:column }
  .rot{ flex:none; display:flex; align-items:center; gap:12px; font-size:22px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; color:var(--coral) }
  .rot svg{ width:36px; height:36px }
  .causa{ flex:none; margin-top:12px; font-size:var(--causa); line-height:1; font-weight:800; letter-spacing:-.035em; text-wrap:balance; font-variation-settings:"opsz" 96 }
  .sem-causa .causa{ display:none }
  .linha{ flex:none; display:flex; align-items:center; gap:18px; margin-top:22px }
  .pilula{ background:var(--coral); color:#fff; border-radius:999px; padding:10px 26px 12px; font-size:32px; font-weight:800; letter-spacing:-.02em; white-space:nowrap }
  .pilula small{ font-size:21px; font-weight:600; opacity:.9; margin-left:4px }
  .linha .txt{ font-size:25px; font-weight:600; color:var(--cinza) }
  .premios{ flex:none; margin-top:22px; display:grid; grid-template-columns:1fr 1fr; gap:14px }
  .foto{ position:relative; height:var(--foto); border-radius:30px; overflow:hidden; background:#222 }
  .foto img{ width:100%; height:100%; object-fit:cover; display:block }
  .etq{ position:absolute; left:14px; bottom:14px; background:#fff; border-radius:16px; padding:8px 14px 9px }
  .etq b{ display:block; font-size:20px; font-weight:750; line-height:1.15 }
  .etq b i{ font-style:normal; color:var(--coral) }
  .etq span{ font-size:16px; color:var(--cinza); font-weight:500 }
  .numeros{ flex:1; min-height:0; margin-top:18px; background:#fff; border-radius:30px; padding:16px 18px 18px; display:flex; flex-direction:column }
  .rotulo{ flex:none; display:flex; align-items:center; gap:22px; height:30px; padding:0 4px }
  .rotulo h2{ font-size:23px; font-weight:800 }
  .info{ font-size:18px; color:var(--cinza); display:flex; align-items:center; gap:8px; font-weight:500 }
  .info svg{ width:22px; height:22px }
  .status{ margin-left:auto; font-size:19px; font-weight:600; white-space:nowrap }
  .status b{ color:var(--coral); font-weight:800 }
  .sorte-rotulo{ font-size:26px; font-weight:800; letter-spacing:-.02em; color:var(--coral); margin-left:14px }
  html:not(.sem-frase) .sorte-rotulo{ display:none }
  .grade{ flex:1; min-height:0; margin-top:8px; display:grid; grid-template-rows:repeat(var(--blocos),1fr); row-gap:var(--gap) }
  .bloco{ position:relative; display:grid; grid-template-columns:repeat(20,1fr); grid-template-rows:repeat(5,1fr) }
  .sep{ position:absolute; left:8px; top:calc(var(--gap) / -2 - 1px); width:calc(100% - 16px); height:2px; display:block }
  .cel{ position:relative; display:flex; align-items:center; justify-content:center; font-size:var(--fonte); font-weight:650; font-variant-numeric:tabular-nums; letter-spacing:-.03em }
  .cel span{ position:relative }
  .cel .z{ opacity:.25 }
  .coracao-v{ position:absolute; left:50%; top:52%; width:2em; height:1.82em; margin:-.91em 0 0 -1em }
  .cel.vendido{ color:#fff; font-weight:750 }
  .cel.vendido .z{ opacity:.7 }
  .rodape{ flex:none; margin-top:16px; padding:0 4px; display:flex; align-items:baseline; justify-content:flex-end; gap:24px }
  .sem-frase .rodape{ display:none }
  .frase{ flex:1; min-width:0; font-size:22px; line-height:1.15; font-weight:600; text-wrap:balance }
  .sorte{ flex:none; font-size:30px; font-weight:800; letter-spacing:-.02em; color:var(--coral) }
</style>
</head>
<body>
  <p class="rot"><svg viewBox="0 0 24 22"><path fill="#e9524a" d="M12 21.5s-8.6-5.3-11.3-10.7C-1.2 7 1 2 5.8 2c2.7 0 4.4 1.6 6.2 4 1.8-2.4 3.5-4 6.2-4 4.8 0 7 5 5.1 8.8C20.6 16.2 12 21.5 12 21.5z"/></svg>Rifa solidária</p>
  <h1 class="causa" data-causa data-ajuste="max:var(--causa);min:40;linhas:3"></h1>
  <div class="linha"><span class="pilula">R$ <span data-valor>20</span><small>por número</small></span><span class="txt">Concorra a 4 prêmios</span></div>
  <section class="premios">
    <div class="foto"><img src="fotos/h1-panela.jpg" alt=""><div class="etq"><b><i>1º</i> Panela Elétrica de Pressão</b><span>Agratto</span></div></div>
    <div class="foto"><img src="fotos/h2-kit-perfume.jpg" alt="" style="object-position:50% 80%"><div class="etq"><b><i>2º</i> Kit Perfume Unissex</b><span>L’Essence</span></div></div>
    <div class="foto"><img src="fotos/h3-botina.jpg" alt=""><div class="etq"><b><i>3º</i> Botina Masculina</b><span>FlexFort</span></div></div>
    <div class="foto"><img src="fotos/h4-cafeteira.jpg" alt="" style="object-position:50% 30%"><div class="etq"><b><i>4º</i> Cafeteira Elétrica</b><span>Cadence</span></div></div>
  </section>
  <section class="numeros">
    <div class="rotulo">
      <h2>Números</h2>
      <div class="info"><svg viewBox="0 0 24 22"><path fill="#e9524a" d="M12 21.5s-8.6-5.3-11.3-10.7C-1.2 7 1 2 5.8 2c2.7 0 4.4 1.6 6.2 4 1.8-2.4 3.5-4 6.2-4 4.8 0 7 5 5.1 8.8C20.6 16.2 12 21.5 12 21.5z"/></svg><span>vendido</span></div>
      <div class="status" id="status"></div>
      <span class="sorte-rotulo">Boa sorte!</span>
    </div>
    <div class="grade" id="grade" data-sep></div>
  </section>
  <footer class="rodape"><p class="frase" data-frase data-ajuste="max:22;min:15;linhas:2"></p><p class="sorte">Boa sorte!</p></footer>
<template id="tpl-sep"><svg class="sep"><line x1="1" y1="1" x2="100%" y2="1" stroke="#f1cfc0" stroke-width="2" stroke-linecap="round" stroke-dasharray="0 4"/></svg></template>
<template id="tpl-marca" data-onde="antes"><svg class="coracao-v" viewBox="0 0 24 22"><path fill="#e9524a" d="M12 21.5s-8.6-5.3-11.3-10.7C-1.2 7 1 2 5.8 2c2.7 0 4.4 1.6 6.2 4 1.8-2.4 3.5-4 6.2-4 4.8 0 7 5 5.1 8.8C20.6 16.2 12 21.5 12 21.5z"/></svg></template>
<script src="motor.js"></script>
</body>
</html>
