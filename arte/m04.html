<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Rifa — 4 Vitrine</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wdth,wght@75..100,400..700&display=block" rel="stylesheet">
<style>
  :root{ --branco:#ffffff; --tinta:#0e0e0f; --cinza:#8a8a8f; --linha:#e9e9e9; --limao:#d6f35a;
         --foto:430px; --fonte:22px; --blocos:3; --gap:19px }
  [data-qtd="400"]{ --foto:350px; --fonte:22px; --blocos:4; --gap:14px }
  [data-qtd="500"]{ --foto:282px; --fonte:20px; --blocos:5; --gap:11px }
  *{ box-sizing:border-box; margin:0; padding:0 }
  html,body{ width:1080px; height:1920px; overflow:hidden; background:var(--branco) }
  body{ font-family:"Instrument Sans",sans-serif; color:var(--tinta); padding:64px; display:flex; flex-direction:column }
  .cab{ flex:none; display:flex; justify-content:space-between; align-items:flex-start }
  .micro{ font-size:19px; font-weight:500; color:var(--cinza) }
  .titulo{ font-size:160px; font-weight:700; line-height:.95; letter-spacing:-.055em; margin-top:4px }
  .preco{ text-align:right; margin-top:30px }
  .pilula{ display:inline-flex; align-items:baseline; gap:6px; height:116px; padding:0 40px; border-radius:58px; background:var(--limao); font-weight:700; line-height:116px; letter-spacing:-.04em; white-space:nowrap }
  .pilula small{ font-size:36px }
  .pilula span{ font-size:78px }
  .preco .por{ margin-top:10px; font-size:20px; font-weight:500; color:var(--cinza) }
  .causa{ flex:none; margin-top:18px; font-size:42px; font-weight:700; line-height:1.28; letter-spacing:-.025em; text-wrap:balance }
  .causa span{ background:var(--limao); padding:0 10px; -webkit-box-decoration-break:clone; box-decoration-break:clone; border-radius:6px }
  .sem-causa .causa{ display:none }
  .sub{ flex:none; margin-top:14px; font-size:28px; font-weight:600; color:var(--cinza); letter-spacing:-.015em }
  .premios{ flex:none; margin-top:22px; display:grid; grid-template-columns:repeat(4,1fr); column-gap:16px }
  .premio{ position:relative }
  .foto{ height:var(--foto); border-radius:20px; overflow:hidden; background:#ddd }
  .foto img{ width:100%; height:100%; object-fit:cover; display:block }
  .ordem{ position:absolute; left:12px; top:12px; width:50px; height:50px; border-radius:50%; background:var(--tinta); color:#fff; display:grid; place-items:center; font-size:21px; font-weight:700 }
  .nome{ margin-top:14px; font-size:22px; font-weight:600; line-height:1.16; letter-spacing:-.015em }
  .marca{ margin-top:4px; font-size:18px; font-weight:500; color:var(--cinza) }
  .fio{ flex:none; height:1px; background:var(--linha); margin-top:22px }
  .rotulo{ flex:none; display:flex; align-items:center; gap:24px; height:30px; margin-top:18px }
  .rotulo h2{ font-size:23px; font-weight:700; letter-spacing:-.02em }
  .info{ font-size:19px; font-weight:500; color:var(--cinza); display:flex; align-items:center; gap:10px }
  .amostra{ width:34px; height:22px; border-radius:11px; background:var(--tinta) }
  .status{ margin-left:auto; font-size:19px; font-weight:500; white-space:nowrap }
  .status b{ font-weight:700 }
  .sorte-rotulo{ font-size:22px; font-weight:700; background:var(--limao); padding:2px 12px; border-radius:8px; margin-left:12px }
  html:not(.sem-frase) .sorte-rotulo{ display:none }
  .grade{ flex:1; min-height:0; margin-top:12px; display:grid; grid-template-rows:repeat(var(--blocos),1fr); row-gap:var(--gap) }
  .bloco{ position:relative; display:grid; grid-template-columns:repeat(20,1fr); grid-template-rows:repeat(5,1fr) }
  .sep{ position:absolute; left:0; right:0; top:calc(var(--gap) / -2); height:1px; background:var(--linha) }
  .cel{ position:relative; display:flex; align-items:center; justify-content:center; font-size:var(--fonte); font-weight:600; font-variant-numeric:tabular-nums; letter-spacing:-.03em }
  .cel:nth-of-type(20n+10){ border-right:1px solid var(--linha) }
  .cel span{ position:relative }
  .cel .z{ opacity:.2 }
  .marca-v{ position:absolute; left:50%; top:50%; width:42px; height:1.36em; margin:-.68em 0 0 -21px; border-radius:999px; background:var(--tinta) }
  .cel.vendido{ color:#fff }
  .cel.vendido .z{ opacity:.55 }
  .rodape{ flex:none; margin-top:16px; display:flex; align-items:baseline; justify-content:flex-end; gap:24px }
  .sem-frase .rodape{ display:none }
  .frase{ flex:1; min-width:0; font-size:21px; line-height:1.15; font-weight:500; text-wrap:balance }
  .sorte{ flex:none; font-size:22px; font-weight:700; background:var(--limao); padding:2px 12px; border-radius:8px }
</style>
</head>
<body>
  <header class="cab">
    <div>
      <p class="micro">Nº 001 — <span class="qtd-fim">300</span></p>
      <h1 class="titulo">Rifa</h1>
    </div>
    <div class="preco"><div class="pilula"><small>R$</small><span data-valor>20</span></div><div class="por">por número</div></div>
  </header>
  <p class="causa" data-ajuste="max:42;min:28;linhas:3"><span data-causa></span></p>
  <p class="sub">Concorra a 4 prêmios</p>
  <section class="premios">
    <article class="premio"><div class="foto"><img src="fotos/v1-panela.jpg" alt=""></div><div class="ordem">1º</div><p class="nome">Panela Elétrica<br>de Pressão</p><p class="marca">Agratto</p></article>
    <article class="premio"><div class="foto"><img src="fotos/v2-kit-perfume.jpg" alt=""></div><div class="ordem">2º</div><p class="nome">Kit Perfume<br>Unissex</p><p class="marca">L’Essence</p></article>
    <article class="premio"><div class="foto"><img src="fotos/v3-botina.jpg" alt=""></div><div class="ordem">3º</div><p class="nome">Botina<br>Masculina</p><p class="marca">FlexFort</p></article>
    <article class="premio"><div class="foto"><img src="fotos/v4-cafeteira.jpg" alt=""></div><div class="ordem">4º</div><p class="nome">Cafeteira<br>Elétrica</p><p class="marca">Cadence</p></article>
  </section>
  <div class="fio"></div>
  <div class="rotulo">
    <h2>Números</h2>
    <div class="info"><span class="amostra"></span><span>vendido</span></div>
    <div class="status" id="status"></div>
    <span class="sorte-rotulo">Boa sorte!</span>
  </div>
  <div class="grade" id="grade" data-sep></div>
  <footer class="rodape"><p class="frase" data-frase data-ajuste="max:21;min:15;linhas:2"></p><p class="sorte">Boa sorte!</p></footer>
<template id="tpl-marca" data-onde="antes"><i class="marca-v"></i></template>
<script src="motor.js"></script>
</body>
</html>
